<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="design/css/index.css">
    <link rel="stylesheet" href="design/css/navbar.css">
    <title>Pharmacy Management System</title>
</head>
<body>
    <!-- importing navbar  -->
    <div id="navbar-placeholder"></div>

    <!-- Content frame below navbar -->
    <iframe name="contentFrame" id="contentFrame" style="width: 100%; height: 85vh; border: none; display: none;"></iframe>



    <script>
        if (window.self !== window.top) {
            window.top.location.href = window.location.href;
        }

        fetch('layouts/navbar.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
            });

        // Toggle between home view and content frame
        document.addEventListener('click', function(e) {
            const link = e.target.closest('a');
            if (!link) return;

            if (link.getAttribute('target') === 'contentFrame') {
                document.getElementById('contentFrame').style.display = 'block';
                document.getElementById('home-content').style.display = 'none';
            } else if (link.getAttribute('href') === 'index.html') {
                e.preventDefault();
                document.getElementById('contentFrame').style.display = 'none';
                document.getElementById('home-content').style.display = 'block';
            }
        });
    </script>
</body>
</html>
