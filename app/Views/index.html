<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="design/css/index.css">
    <title>Pharmacy Management System</title>
</head>
<body>
    <img src="design/images/logo1.png" id="logo" alt="Pharmacy Logo">

    <div class="header">
        <h1>Pharmacy Management System</h1>
        <p>Choose user type</p>
    </div>

    <div class="user-grid">
        <div class="user-card admin">
            <h2>Admin</h2>
            <p>Manage Admin,Stuff,Customer & medicine</p>
            <a href="admin/adminreg.html">
                <button type="button" class="user-btn">Admin Registration</button>
            </a>
        </div>

        <div class="user-card stuff">
            <h2>Stuff</h2>
            <p>Manage Customer & medicine</p>
            <a href="stuff/Stuff_Registration.html">
                <button type="button" class="user-btn">Stuff Registration</button>
            </a>
        </div>

        <div class="user-card customer">
            <h2>Customer</h2>
            <p>Can Order medicine </p>
            <a href="customer/AddCustomer.html">
                <button type="button" class="user-btn">Customer Registration</button>
            </a>
        </div>

        <div class="user-card medicine">
            <h2>Medicine</h2>
            <p>Add new Medicine </p>
            <a href="medicines/AddMedicine.html">
                <button type="button" class="user-btn">Medicine Registration</button>
            </a>
        </div>
    </div>

    <div class="footer">
        <h5>Created by Shovan,Nishat,Redip,Abdullah</h5>
    </div>
</body>
</html>
