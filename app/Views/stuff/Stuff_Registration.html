<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../design/css/common.css">
    <link rel="stylesheet" href="../design/css/Stuff_Registration.css">
    <script src="../design/js/Stuff_Registration.js" defer></script>
    <title>Stuff Registration</title>
</head>
<body>
    <div class="topnav">
        <a href="Stuff_Registration.html" class="active">Stuff Registration</a>
        <a href="ViewAllStuffs.html">View All Stuffs</a>
        <a href="UpdateStuff.html">Update Stuff</a>
    </div>
 
    <img src="../design/images/logo.png" id="logo" alt="">
    <br>
    <h1>Stuff Registration</h1>
 
    <form id="stuffForm" action="" method="post">
        <fieldset>
            <legend> Stuff Personal Information </legend>
            <table>
                <tr>
                    <td><label for="name"> Stuff Name : </label></td>
                    <td>
                        <input type="text" name="name" id="name" placeholder="Enter Stuff Name">
                        <p id="NameError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="dob"> Date of Birth : </label></td>
                    <td>
                        <input type="date" name="dob" id="dob">
                        <p id="DobError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="male"> Gender : </label></td>
                    <td>
                        <input type="radio" name="gender" id="male" value="Male"> Male
                        <input type="radio" name="gender" id="female" value="Female"> Female
                        <p id="GenderError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="phone"> Phone : </label></td>
                    <td>
                        <input type="text" name="phone" id="phone" placeholder="Enter Phone Number">
                        <p id="PhoneError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="department"> Department : </label></td>
                    <td>
                        <input type="text" name="department" id="department" placeholder="Enter Department">
                        <p id="DeptError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="designation"> Designation : </label></td>
                    <td>
                        <select name="designation" id="designation">
                            <option value="blank">Select Designation</option>
                            <option value="Receptionist">Receptionist</option>
                            <option value="Nurse">Nurse</option>
                            <option value="Guard">Guard</option>
                            <option value="Cleaner">Cleaner</option>
                            <option value="Technician">Technician</option>
                            <option value="Assistant">Assistant</option>
                            <option value="Pharmacist">Pharmacist</option>
                            <option value="Security Guard">Security Guard</option>
                        </select>
                        <p id="DesignationError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="morning"> Shift : </label></td>
                    <td>
                        <input type="checkbox" name="shift" id="morning" value="Morning"> Morning
                        <input type="checkbox" name="shift" id="afternoon" value="Afternoon"> Afternoon
                        <input type="checkbox" name="shift" id="evening" value="Evening"> Evening
                        <input type="checkbox" name="shift" id="night" value="Night"> Night
                        <p id="ShiftError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="salary"> Salary : </label></td>
                    <td>
                        <input type="number" name="salary" id="salary" placeholder="Enter Salary">
                        <p id="SalaryError"></p>
                    </td>
                </tr>
            </table>
        </fieldset>
        <br>
 
        <fieldset>
            <legend> User Credentials </legend>
            <table>
                <tr>
                    <td><label for="username"> User Name : </label></td>
                    <td>
                        <input type="text" name="username" id="username" placeholder="Enter username">
                        <p id="UsernameError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="email"> Email : </label></td>
                    <td>
                        <input type="email" name="email" id="email" placeholder="Enter Your Email">
                        <p id="EmailError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="password"> Password : </label></td>
                    <td>
                        <input type="password" name="password" id="password" placeholder="Enter user password">
                        <p id="PasswordError"></p>
                    </td>
                </tr>
            </table>
        </fieldset>
        <br>
 
        <div class="button-group">
            <input type="submit" id="submit" value="Create Stuff">
            <input type="reset" id="reset" value="Reset">
        </div>
    </form>
</body>
</html>
