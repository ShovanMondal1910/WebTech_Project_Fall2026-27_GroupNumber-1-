<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Manufacturer</title>
    <link rel="stylesheet" href="../design/css/common.css">
</head>
<body>
    <h1>Add Manufacturer Information</h1>
    <fieldset>
        <legend>Manufacturer</legend>
        <table>
            <tr>
                <td><label for="manufacturerID">Manufacturer ID : </label></td>
                <td><input type="text" id="manufacturerID" name="manufacturerID" placeholder="Enter manufacturer ID"></td>
            </tr>
            <tr>
                <td><label for="manufacturerName">Manufacturer Name : </label></td>
                <td><input type="text" id="manufacturerName" name="manufacturerName" placeholder="Enter Manufacturer Name"></td>
            </tr>
            <tr>
                <td><label for="address">Address : </label></td>
                <td><textarea name="address" id="address" cols="30" rows="10" placeholder="Enter Address"></textarea></td>
            </tr>
            <tr>
                <td><label for="phoneNumber">Phone Number : </label></td>
                <td><input type="text" id="phoneNumber" name="phoneNumber" placeholder="Enter Phone Number"></td>
            </tr>
            <tr>
                <td><label for="email">Email : </label></td>
                <td><input type="text" id="email" name="email" placeholder="Enter Email"></td>
            </tr>  
        </table>
    </fieldset>
    <br>
    <table>
        <tr>
            <td><input type="submit" id="submit" value="Add Manufacturer"></td>
            <td><input type="reset" id="reset" value="Reset"></td>
        </tr>
    </table>
</body>
</html>
