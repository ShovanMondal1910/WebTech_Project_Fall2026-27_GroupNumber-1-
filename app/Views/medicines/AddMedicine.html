    <body>
        <h1>Add Medicine</h1>
        <form action="">
            <fieldset>
                <legend>Medicine Information</legend>
                <table>
                    <tr>
                        <td><label for="medicineID">Medicine ID : </label></td>
                        <td><input type="text" id="medicineID" name="medicineID" placeholder="Generated ID"><input type="button" value="Generate ID"></td>
                    </tr>
                    <tr>
                        <td><label for="medicineName">Medicine Name : </label></td>
                        <td><input type="text" id="medicineName" name="medicineName" placeholder="Enter Medicine Name"></td>
                    </tr>
                    <tr>
                        <td><label for="brandName">Brand Name : </label></td>
                        <td><input type="text" id="brandName" name="brandName" placeholder="Enter Brand Name"></td>
                    </tr>
                    <tr>
                        <td><label for="genericName">Generic Name : </label></td>
                        <td><input type="text" id="genericName" name="genericName" placeholder="Enter Generic Name"></td>
                    </tr>
                    <tr>
                        <td><label for="category">Category : </label></td>
                        <td>
                            <select name="" id="">
                                <option value="" selected disabled>Select Category</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="manufacturerID">Manufacturer ID : </label></td>
                        <td><input type="text" id="manufacturerID" name="manufacturerID" placeholder="Enter Manufacturer ID"><input type="button" value="Search"></td>
                    </tr>
                    <tr>
                        <td><label for="manufacturerName">Manufacturer Name : </label></td>
                        <td><input type="text" id="manufacturerName" name="manufacturerName" placeholder="Enter Manufacturer Name"></td>
                    </tr>
                    <tr>
                        <td><label for="strength">Strength : </label></td>
                        <td><input type="text" id="strength" name="strength" placeholder="Enter Strength"></td>
                    </tr>
                    <tr>
                        <td><label for="dosageForm">Dosage Form : </label></td>
                        <td>
                            <select name="" id="">
                                <option value="" selected disabled>Select Dosage Form</option>
                                <option value="">Tablet</option >
                                <option value="">Cream</option>
                                <option value="">Capsule</option>
                                <option value="">Syrup</option>
                                <option value="">Injection</option>
                                <option value="">Ointment</option>
                                <option value="">Drops</option>
                                <option value="">Inhaler</option>
                                <option value="">Suppository</option>
                                <option value="">Powder</option>
                                <option value="">Patches</option>
                                <option value="">Vitamins</option>
                                <option value="">Supplements</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="unitName">Unit Name : </label></td>
                        <td><select name="" id="">
                            <option value="" selected disabled>Select Unit Name</option>
                            <option value="">Pc</option>
                            <option value="">Box</option>
                            <option value="">Strip</option>
                            <option value="">Gm</option>
                            <option value="">Ml</option>
                            <option value="">IU</option>
                            <option value="">mg</option>
                            <option value="">mcg</option>
                            <option value="">L</option>
                            <option value="">ml</option>
                            <option value="">Pcs</option>
                            <option value="">Bags</option>
                            <option value="">Pouch</option>
                            <option value="">Pots</option>
                        </select></td>
                    </tr>                  
                    <tr>
                        <td><label for="barcode">Barcode : </label></td>
                        <td><input type="text" id="barcode" name="barcode" placeholder="Enter Barcode"><input type="button" value="Generate Barcode"></td>
                    </tr>
                </table>
            </fieldset>
