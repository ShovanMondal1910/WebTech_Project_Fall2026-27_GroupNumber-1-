<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Information</title>
    <link rel="stylesheet" href="../design/css/common.css">
</head>
<body>
    <h1>Add Medicine Information</h1>
    <fieldset>
        <legend>Medicine Category</legend>
        <table>
            <tr>
                <td><label for="categoryID">Category ID : </label></td>
                <td><input type="text" id="categoryID" name="categoryID" placeholder="Enter category ID"></td>
            </tr>
            <tr>
                <td><label for="categoryName">Category Name : </label></td>
                <td><input type="text" id="categoryName" name="categoryName" placeholder="Enter Category Name"></td>
            </tr>
            <tr>
                <td><label for="description">Description : </label></td>
                <td>
                    <textarea name="description" id="description" cols="30" rows="10" placeholder="Enter Description"></textarea>
                </td>
            </tr>
        </table>
    </fieldset>
    <fieldset>
        <legend>Manufacturer Information</legend>
        <table>
            <tr>
                <td><label for="manufacturerID">Manufacturer ID : </label></td>
                <td><input type="text" id="manufacturerID" name="manufacturerID" placeholder="Enter manufacturer ID"></td>
            </tr>
            <tr>
                <td><label for="manufacturerName">Manufacturer Name : </label></td>
                <td><input type="text" id="manufacturerName" name="manufacturerName" placeholder="Enter Manufacturer Name"></td>
            </tr>
            <tr>
                <td><label for="contactPerson">Contact Person : </label></td>
                <td><input type="text" id="contactPerson" name="contactPerson" placeholder="Enter Contact Person"></td>
            </tr>
            <tr>
                <td><label for="address">Address : </label></td>
                <td><textarea name="address" id="address" cols="30" rows="10" placeholder="Enter Address"></textarea></td>
            </tr>
            <tr>
                <td><label for="phoneNumber">Phone Number : </label></td>
                <td><input type="text" id="phoneNumber" name="phoneNumber" placeholder="Enter Phone Number"></td>
            </tr>
            <tr>
                <td><label for="email">Email : </label></td>
                <td><input type="text" id="email" name="email" placeholder="Enter Email"></td>
            </tr>
            <tr>
                <td><label for="notes">Notes : </label></td>
                <td><textarea name="notes" id="notes" cols="30" rows="10" placeholder="Enter Notes"></textarea></td>
            </tr>   
        </table>
    </fieldset>
    <br>
    <table>
        <tr>
            <td><input type="submit" id="submit" value="Submit"></td>
            <td><input type="reset" id="reset" value="Reset"></td>
        </tr>
    </table>
</body>
</html>
