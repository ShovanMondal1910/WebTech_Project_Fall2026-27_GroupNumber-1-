<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stuff Welcome</title>
    <link rel="stylesheet" href="../Design/Stuff_Welcome.css">
    <script src="../JS/Stuff_Welcome.js" defer></script>
</head>

<body>

    <!-- Logo and heading -->
    <img src="../../design/images/logo.png" id="logo" alt="Logo">
    <br>
    <h1>Welcome to Stuff Panel</h1>
    <h2 id="greeting"></h2>

    <!-- Cards for the other Stuff pages -->
    <div class="stuff-grid">

          <div class="stuff-card">
              <h3>Sell Medicine</h3>
              <p>Sell medicine and print bill</p>
              <a href="SellMedicine.html">
                  <button type="button" class="card-btn">Open</button>
              </a>
          </div>

        <div class="stuff-card">
            <h3>Stuff Registration</h3>
            <p>Add a new stuff</p>
            <a href="Stuff_Registration.html">
                <button type="button" class="card-btn">Open</button>
            </a>
        </div>

        <div class="stuff-card">
            <h3>View All Stuffs</h3>
            <p>See and search all stuffs</p>
            <a href="ViewAllStuffs.html">
                <button type="button" class="card-btn">Open</button>
            </a>
        </div>

        <div class="stuff-card">
            <h3>Update Stuff</h3>
            <p>Edit stuff information</p>
            <a href="UpdateStuff.html">
                <button type="button" class="card-btn">Open</button>
            </a>
        </div>

    </div>

    <!-- Home and Logout buttons -->
    <div class="bottom-buttons">
        <a href="../../index.html">
            <button type="button" id="home">Back to Home</button>
        </a>
        <button type="button" id="logout">Logout</button>
    </div>

</body>

</html>
