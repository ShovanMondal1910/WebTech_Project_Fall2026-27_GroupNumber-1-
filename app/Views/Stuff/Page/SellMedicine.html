<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Medicine</title>
    <link rel="stylesheet" href="../Design/SellMedicine.css">
    <script src="../JS/SellMedicine.js" defer></script>
</head>

<body>

<div class="topnav">
    <a href="Stuff_Welcome.html">Stuff Panel</a>
    <a href="ViewAllStuffs.html">View All Stuffs</a>
    <a href="UpdateStuff.html">Update Stuff</a>
    <a href="SellMedicine.html" class="active">Sell Medicine</a>
</div>

    <img src="../../design/images/logo.png" id="logo" alt="Logo">
    <br>
    <h1>Sell Medicine</h1>

    <form id="sellForm" action="" method="post">

        <fieldset>
            <legend> Medicine Information </legend>
            <table>
                <tr>
                    <td><label for="medicine"> Medicine : </label></td>
                    <td>
                        <select name="medicine" id="medicine">
                            <option value="blank">Select Medicine</option>
                        </select>
                        <p id="MedicineError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="price"> Price (Tk) : </label></td>
                    <td>
                        <input type="text" name="price" id="price" placeholder="Select a medicine first" readonly>
                    </td>
                </tr>
                <tr>
                    <td><label for="stock"> Available Stock : </label></td>
                    <td>
                        <input type="text" name="stock" id="stock" placeholder="Select a medicine first" readonly>
                    </td>
                </tr>
            </table>
        </fieldset>
        <br>

        <fieldset>
            <legend> Bill Information </legend>
            <table>
                <tr>
                    <td><label for="quantity"> Quantity : </label></td>
                    <td>
                        <input type="number" name="quantity" id="quantity" placeholder="Enter Quantity">
                        <p id="QuantityError"></p>
                    </td>
                </tr>
                <tr>
                    <td><label for="total"> Total (Tk) : </label></td>
                    <td>
                        <input type="text" name="total" id="total" placeholder="Click Count Total" readonly>
                    </td>
                </tr>
            </table>
            <p id="BillMessage"></p>
        </fieldset>
        <br>

        <div class="button-group">
            <input type="button" id="countTotal" value="Count Total">
            <input type="submit" id="submit" value="Print Bill">
            <input type="reset" id="reset" value="Reset">
        </div>

    </form>

</body>

</html>
