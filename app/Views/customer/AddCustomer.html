<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../design/css/customerStyle.css"> 
        <title> Customer Registration Form </title>
        <script src="../design/js/CustomerValidation.js"></script>
    </head>
    <body>
        <img src="../admin/logo.png" id="logo" alt="Logo"> 
        <br>

        <h1>Customer </h1>
        <form onsubmit="return collect_customer_data()">
            <fieldset>
                <legend> Customer Personal Information </legend>
               <table>
                <tr>
                    <td> <label for="CustomerName"> Customer Name :  </label> </td>
                    <td> <input type="text" name="CustomerName" id="CustomerName" for="CustomerName" placeholder="Enter Your Name"> 
                    <p id="CustomerNameError" class="Errors"></p></td>
                </tr>

               <tr> 
                    <td> <label for="DOB"> Date of Birth : </label></td>
                    <td> <input type ="date" name ="DOB" id="DOB" for="DOB"> 
                     <p id="DOBError" class="Errors"></p>
                    </td>
                </tr>

                <tr>
                    <td> <label for="CustomerGender"> Gender : </label></td>
                    <td> <input type="radio" name="gender" id="Male" value="Male">
                        <label for="Male"> Male</label> 
                        
                        <input type="radio" name="gender" id="Female" value="Female">
                        <label for="Female"> Female</label>

                     <p id="GenderError" class="Errors"></p>
                    </td>
                </tr>

                <tr>
                    <td> <label for="CustomerPhone"> Contact : </label></td>
                    <td> <input type="phone" name="CustomerPhone" id="CustomerPhone" for="CustomerPhone" placeholder="Enter Your Phone ">

                     <p id="CustomerPhoneError" class="Errors"></p>
                     </td>
                </tr>
                
                <tr> 
                    <td> <label for="Address"> Address : </label></td>
                    <td> 
                        <textarea id="Address" for="Address" cols="20" rows="5" style="resize: none;"></textarea>
                        <p id="AddressError" class="Errors"></p>
                    </td>
                </tr>

                <tr> 
                    <td> <label for="PatientDoc"> Medical History : </label></td>
                    <td> <input type ="file" name ="file" id="medicaldoc" for="medicaldoc"> 
                    
                    <p id="fileError" class="Errors"></p>
                    </td>
                </tr>

                <tr>
                    <td><label for="Citizen"> Citizenship : </label> </td>
                    <td>
                        <select name="Citizen" id="Citizen" for="Citizen">
                            <option value=""> Select Country </option>
                            <option value="BD"> Bangladesh </option>
                            <option value="IND"> India </option>
                            <option value="PAK"> Pakistan </option>
                            <option value="USA"> USA </option>
                            <option value ="UK"> UK </option>
                            <option value="AUS"> Australia </option>
                            <option value="JP"> Japan </option>
                            <option value="CN"> China </option>
                            <option value="MB"> Myanmar </option>
                            <option value="SA"> Saudi Arabia </option>
                            <option value="SG"> Singapore </option>
                            <option value="TH"> Thailand </option>
                            <option value="CA"> Canada </option>
                            <option value="FR"> France </option>
                            <option value="DE"> Germany </option>
                            <option value="KR"> South Korea </option>
                            <option value="MAL"> Malaysia </option>
                            <option value="UAE"> UAE </option>
                        </select>
                    
                    <p id="citizenError" class="Errors"></p>
                    </td>
                </tr>
               </table>
            </fieldset>
            <br>
            <fieldset>
                <legend> User Credentials </legend>
                <table>
                    <tr>
                        <td> <label for="username"> Username: </label> </td>
                        <td> <input type="text" id="username" for="username" placeholder="Enter username">
                        
                         <p id="usernameError" class="Errors"></p>
                        </td>
                    </tr>
                    <tr>
                        <td>  <label for="email"> Email : </label> </td>
                        <td> <input type="email" name="email" id="email" for="email" placeholder="Enter Your Email "> 
                        
                        <p id="emailError" class="Errors"></p>
                        </td>
                    </tr>
                    <tr>
                        <td> <label for="password"> Password: </label></td>
                        <td> <input type="password" id="password" for="password" placeholder="Enter user password">
                        
                        <p id="passwordError" class="Errors"></p>
                        </td>

                    </tr>
                </table>
            </fieldset>
            <br>

            <div class="button-group">
                <input type="submit" id="submit" value="Create Customer">
                <input type="reset" id="reset" value="Reset">
            </div>
        </form>
    </body>
</html>
