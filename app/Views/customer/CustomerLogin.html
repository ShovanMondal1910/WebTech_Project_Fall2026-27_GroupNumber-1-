<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../design/css/customerStyle.css"> 
         <link rel="stylesheet" href="../design/css/CustomerLogin.css"> 
        <title> Customer Registration Form </title>
        <script src="../design/js/CustomerLoginValidation.js"></script>
    </head>
    <body>
        <img src="../admin/page/logo.png" id="logo" alt="Logo"> 
        <br>

        <h1>Login </h1>
        <form onsubmit="return collect_customer_login_data()">
            <fieldset>
                 <legend> Customer Personal Information </legend>
               <table>
                <tr>
                    <td> <label for="username"> Username :  </label> </td>
                    <td> <input type="text" name="username" id="username" for="username" placeholder="Enter your username"> 

                    <p id="usernameError" class="Errors"></p>
                </td>
                </tr>

                <tr>
                    <td> <label for="password"> Password :  </label> </td>
                    <td> <input type="password" name="password" id="password" for="password" placeholder="Enter your password"> 

                    <p id="passwordError" class="Errors"></p>
                    </td>
                </tr>
                </table>
                </fieldset>
                <br>
                <label for="signup"> Create new account </label>
                <label for ="signup"><a href="AddCustomer.html">Sign Up</a></label>
                <br>
                <label for="forgotPassword">Forgot Password? </a></label>
                <label for ="resetPassword"><a href="CustomerResetPassword.html">Reset Password</a></label>
                
                <div class="button-group">
                <input type="submit" id="submit" value="Login"><a href="Home.html"></a>
               
                
            </div>
        </form>
    </body>
    </html>
