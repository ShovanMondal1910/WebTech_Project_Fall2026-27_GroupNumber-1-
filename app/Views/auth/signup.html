<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="../design/css/style.css"> 
        <title> Patient Registration Form </title>
    </head>
    <body>
        <img src="../design/images/logo.png" id="logo" alt="Logo"> 
        <br>

        <h1> Customer Registration Form </h1>
        <form>
            <fieldset>
            
                <legend> User Credentials </legend>
                <table>
                    <tr>
                        <td> <label for="username"> User Name: </label> </td>
                        <td> <input type="text" id="username" for="username" placeholder="Enter username"> </td>
                    </tr>
                    <tr>
                        <td>  <label for="email"> Email : </label> </td>
                        <td> <input type="email" name="email" id="email" for="email" placeholder="Enter Your Email "> </td>
                    </tr>
                    <tr>
                        <td> <label for="password"> Password: </label></td>
                        <td> <input type="password" id="password" for="password" placeholder="Enter user password"></td>

                    </tr>
                </table>
            </fieldset>
            <br>

            <div class="button-group">
                <input type="submit" id="submit" value="Signup">
                <input type="reset" id="reset" value="Reset">
            </div>
            <br>
            <div style="text-align: center;">
                <span>Already have an account? <a href="index.html">Login</a></span>
            </div>
        </form>
    </body>
</html>
