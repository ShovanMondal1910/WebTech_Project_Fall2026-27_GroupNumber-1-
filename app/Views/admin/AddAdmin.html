<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Admin</title>
    <link rel="stylesheet" href="../design/css/common.css">
</head>
<body>
    <img src="../design/images/logo.png" id="logo" alt="">
    <br>
    <h1>Add Admin</h1>
    
    <form>
        <fieldset>
            <legend> Admin Personal Information </legend>
            <table>
                <tr>
                    <td><label for="name"> Admin Name : </label></td>
                    <td><input type="text" name="name" id="name" for="name" placeholder="Enter Admin Name" required></td>
                </tr>
                <tr>
                    <td><label for="dob"> DOB : </label></td>
                    <td><input type="date" name="dob" id="dob" for="dob"></td>
                </tr>
                <tr>
                    <td><label for="gender"> Gender : </label></td>
                    <td><input type="radio" name="gender" id="male" for="gender"> Male <input type="radio" name="gender" id="female" for="gender"> Female </td>
                </tr>
                <tr>
                    <td><label for="phone"> Phone : </label></td>
                    <td><input type="text" name="phone" id="phone" for="phone" placeholder="Enter Phone Number"></td>
                </tr>
                <tr>
                    <td><label for="address"> Address : </label></td>
                    <td><textarea name="" id=""></textarea></td>
                </tr>
                <tr>
                    <td><label for="designation"> Designation : </label></td>
                    <td>
                        <select name="designation" id="designation">
                            <option value="blank">Select Designation</option>
                            <option value="Super Admin">Super Admin</option>
                            <option value="Admin">Admin</option>
                            <option value="Manager">Manager</option>
                        </select>
                    </td>
                </tr>
            </table>
        </fieldset>
        <br>
        <fieldset>
            <legend> User Credentials </legend>
            <table>
                <tr>
                    <td> <label for="username"> User Name: </label> </td>
                    <td> <input type="text" id="username" for="username" placeholder="Enter username"> </td>
                </tr>
                <tr>
                    <td>  <label for="email"> Email : </label> </td>
                    <td> <input type="email" name="email" id="email" for="email" placeholder="Enter Your Email "> </td>
                </tr>
                <tr>
                    <td> <label for="password"> Password: </label></td>
                    <td> <input type="password" id="password" for="password" placeholder="Enter user password"></td>

                </tr>
            </table>
        </fieldset>
        <br>

        <div class="button-group">
            <input type="submit" id="submit" value="Create Admin">
            <input type="reset" id="reset" value="Reset">
        </div>
    </form>
</body>
</html>
