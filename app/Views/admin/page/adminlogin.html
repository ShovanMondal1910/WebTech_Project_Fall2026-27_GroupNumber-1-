<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../design/common.css">
      <script src="../JS/adminlogin.js"> </script>
    <title>Admin Login</title>
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <button type="button" class="nav-toggle" id="navToggle"
                aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">☰</button>

        <ul class="nav-links" id="navLinks">
            <li><a href="..\app\Views\index.html" target="_top">Home</a></li>
            <li><a href="adminreg.html" target="_top">Registration</a></li>

            <!--<li><a href="admin.html">Dashboard</a></li>--->
        </ul>
    </nav>

<h1> Admin Login </h1>

<form id="loginForm" novalidate>
    <fieldset>
        <legend> Admin Login Information </legend>

        <table>
            <tr>
                <td><label for="username"> User Name: </label></td>
                <td>
                    <input type="text" name="username" id="username" placeholder="Enter admin username">
                    <span id="UsernameError"></span>
                </td>
            </tr>

            <tr>
                <td><label for="password"> Password: </label></td>
                <td>
                    <div class="password-box">
                        <input type="password" name="password" id="password" placeholder="Enter admin password">
                        <button type="button" id="togglePassword" class="eye-btn"
                                aria-label="Show password" title="Show password">
                            👁
                        </button>
                    </div>
                    <span id="PasswordError"></span>
                </td>
            </tr>
        </table>

        <span id="LoginError"></span>
    </fieldset>

    <div class="button-group">
        <input type="submit" id="submit" value="Login">
    </div>
</form>

<script src="admin_login.js"></script>
</body>
</html>
